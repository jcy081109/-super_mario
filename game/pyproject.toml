[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mario-play"
version = "0.1.0"
description = "Keyboard playable Super Mario Bros powered by gym-super-mario-bros."
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
where = ["src"]
